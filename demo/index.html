<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iab-escape demo</title>
<style>body{font:18px -apple-system,system-ui,sans-serif;margin:16px;line-height:1.4}pre{background:#f3f3f3;padding:8px;overflow:auto;white-space:pre-wrap;word-break:break-all}button,a.btn{font-size:18px;padding:10px 14px;margin:4px 0;display:inline-block}</style>
</head>
<body>
<h1>iab-escape</h1>
<pre id="env"></pre>
<p><a id="link" class="btn" href="landed.html">Open in browser (fallback link)</a></p>
<p><button id="copy">Copy link</button> <button id="cancel">Cancel auto</button></p>
<pre id="log"></pre>
<script src="../dist/iab-escape.min.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var log = function (m) { $('log').textContent += m + '\n'; };
  var target = new URL('landed.html', location.href).href;
  var esc = new IabEscape({
    url: target,
    onAttempt: function (i) { log('attempt: ' + i.url); },
    onResult: function (i) { log('result: ' + i.outcome); }
  });
  log('iab-escape ' + IabEscape.version + ' built ' + IabEscape.buildTime);
  $('env').textContent = JSON.stringify(esc.detect()) + '\nrule: ' + (esc.getRule() ? esc.getRule().app + '/' + esc.getRule().os : 'none') + '\nurl: ' + esc.buildUrl();
  esc.bindLink($('link'));
  var cancel = esc.auto();
  $('cancel').onclick = function () { cancel(); log('auto cancelled'); };
  $('copy').onclick = function () {
    (navigator.clipboard ? navigator.clipboard.writeText(target) : Promise.reject()).then(function () { log('copied'); }, function () { log('copy failed: ' + target); });
  };
</script>
</body>
</html>
